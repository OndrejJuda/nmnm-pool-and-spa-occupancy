name: scrape

on:
  # Every 15 min, 03:00–20:45 UTC = covers 06:00–21:00 Prague in both CET and CEST.
  # GitHub may delay or skip scheduled runs; the CSV stores the actual time of each run.
  schedule:
    - cron: "*/15 3-20 * * *"
  # Manual run, or an external trigger (e.g. cron-job.org) via the GitHub API.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scrape.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
